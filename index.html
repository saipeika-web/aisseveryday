<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Мой навигатор</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="authGate" class="auth-gate">
    <div class="auth-card">
      <div class="eyebrow">МОЙ НАВИГАТОР</div>
      <h1>Один планер<br>на всех устройствах</h1>
      <p>Войди с одинаковыми email и паролем в браузере и Telegram — данные будут общими.</p>
      <form id="authForm">
        <label>Email<input id="email" type="email" required autocomplete="email"></label>
        <label>Пароль<input id="password" type="password" required minlength="6" autocomplete="current-password"></label>
        <button class="primary" type="submit">Войти</button>
        <button class="secondary" type="button" id="signup">Создать аккаунт</button>
      </form>
      <p id="authMessage" class="message"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header>
      <div><div class="eyebrow" id="dateLabel"></div><h1>Мой навигатор</h1></div>
      <button id="logout" class="icon">⋯</button>
    </header>

    <main>
      <section class="screen active" data-screen="today">
        <div class="head"><div><div class="eyebrow">СЕГОДНЯ</div><h2>Сегодня</h2></div><span id="todayCount"></span></div>
        <div class="streak">🔥 <div><b>Ударный режим</b><small>Держим ритм без перегруза.</small></div></div>
        <div id="todayTasks"></div>
        <form id="addTask" class="add"><input id="taskInput" placeholder="Добавить задачу…"><button>+</button></form>
        <details><summary>Выполнено · <span id="doneCount">0</span></summary><div id="doneTasks"></div></details>
      </section>

      <section class="screen" data-screen="week">
        <div class="head"><div><div class="eyebrow">ЭТА НЕДЕЛЯ</div><h2>Неделя</h2></div></div>
        <div class="card"><div class="eyebrow">ГЛАВНЫЙ ФОКУС</div><h3 id="weekFocus"></h3></div>
        <div id="weekTasks"></div>
      </section>

      <section class="screen" data-screen="month">
        <div class="head"><div><div class="eyebrow" id="monthLabel"></div><h2>Месяц</h2></div></div>
        <div id="monthGoals"></div>
        <h3 class="section-title">Желания месяца</h3>
        <div id="monthWishes"></div>
      </section>

      <section class="screen" data-screen="year">
        <div class="head"><div><div class="eyebrow" id="yearLabel"></div><h2>Мой год</h2></div></div>
        <div id="yearGoals"></div>
        <h3 class="section-title">50 желаний · <span id="wishCount"></span></h3>
        <div id="wishDots" class="dots"></div>
      </section>
    </main>

    <nav>
      <button class="active" data-target="today">✓<small>Сегодня</small></button>
      <button data-target="week">7<small>Неделя</small></button>
      <button data-target="month">30<small>Месяц</small></button>
      <button data-target="year">✦<small>Мой год</small></button>
    </nav>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
